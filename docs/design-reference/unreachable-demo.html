<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UNREACHABLE: emergency access intelligence</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,500;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e4e7df;--ink:#1c1f1b;--mute:#5d635a;--line:rgba(28,31,27,.18);--tape:#ffd60a;--ok:#168a5c;--amb:#e8710a;--sig:#d7263d;--unk:#7d837a;--glass:rgba(228,231,223,.8);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#151714;--ink:#eceee7;--mute:#9aa093;--line:rgba(236,238,231,.18);--ok:#34c38a;--amb:#ff8a3d;--sig:#ff4d63;--unk:#8f958b;--glass:rgba(21,23,20,.8);color-scheme:dark}}
:root[data-theme=dark]{--bg:#151714;--ink:#eceee7;--mute:#9aa093;--line:rgba(236,238,231,.18);--ok:#34c38a;--amb:#ff8a3d;--sig:#ff4d63;--unk:#8f958b;--glass:rgba(21,23,20,.8);color-scheme:dark}
*{box-sizing:border-box;margin:0}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font:16px/1.5 'Bricolage Grotesque',system-ui,sans-serif;overflow-x:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;filter:blur(7px);opacity:.13;transform:scale(1.035);pointer-events:none}
a{color:inherit}button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--tape);outline-offset:2px}
.top{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:30;display:flex;justify-content:space-between;align-items:center;padding:14px clamp(16px,4vw,40px);pointer-events:none}
.top>*{pointer-events:auto}
.brand{display:flex;gap:10px;align-items:center;text-decoration:none;font-weight:800;letter-spacing:.04em}
.brand i{width:30px;height:30px;background:var(--ink);border-radius:8px;position:relative;overflow:hidden}
.brand i:after{content:"";position:absolute;left:-4px;right:-4px;top:12px;height:6px;background:repeating-linear-gradient(90deg,var(--tape) 0 7px,transparent 7px 11px)}
.tr{display:flex;gap:10px;align-items:center}
.demo{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:500;background:var(--glass);backdrop-filter:blur(10px);border:1px solid var(--line);padding:7px 12px;border-radius:99px}
.demo:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--tape);box-shadow:0 0 0 0 var(--tape);animation:pu 2s infinite}
@keyframes pu{70%{box-shadow:0 0 0 8px transparent}}
.ic{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(10px)}
.dk{position:fixed;bottom:max(14px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:30;display:flex;gap:4px;padding:6px;background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:99px;max-width:96vw;overflow-x:auto;scrollbar-width:none}
.dk a{display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:99px;text-decoration:none;font-weight:500;white-space:nowrap;transition:background .2s}
.dk a b{font-size:18px;font-weight:500}.dk a span{max-width:0;overflow:hidden;transition:max-width .3s}
.dk a:hover span,.dk a.on span{max-width:130px}.dk a.on{background:var(--ink);color:var(--bg)}
.dk a:hover:not(.on){background:var(--line)}
@media(max-width:700px){.dk a:hover:not(.on) span{max-width:0}.dk a{padding:0 12px}#bg{filter:blur(8px);opacity:.09}}
main{position:relative;z-index:2;padding-top:84px}
.v{max-width:1180px;margin:0 auto;padding:0 clamp(16px,4vw,40px) 120px}
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:48px;align-items:center;min-height:calc(100vh - 230px);padding-top:12px}
h1{font-size:clamp(40px,6vw,82px);line-height:.98;letter-spacing:-.035em;font-weight:800}
h1 span{display:block;font-weight:300}
h2{font-size:clamp(26px,3.4vw,42px);line-height:1.05;letter-spacing:-.025em;font-weight:800;margin-bottom:8px}
h3{font-size:20px;font-weight:800;letter-spacing:-.01em}
.tape{height:10px;margin:22px 0;max-width:320px;background:repeating-linear-gradient(135deg,var(--tape) 0 10px,var(--ink) 10px 20px)}
.lede{max-width:52ch;color:var(--mute);font-size:18px}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
.btn{display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 20px;border-radius:99px;border:1.5px solid var(--ink);background:transparent;text-decoration:none;font-weight:500;transition:transform .15s,background .15s}
.btn:hover{transform:translateY(-2px)}.btn.pri{background:var(--ink);color:var(--bg)}.btn.sm{height:34px;padding:0 14px;font-size:14px}.btn.on{background:var(--tape);color:#1c1f1b;border-color:#1c1f1b}
.prev{display:block;position:relative;text-decoration:none}.prev .map{aspect-ratio:1000/560;width:100%;height:auto}
.prev span{position:absolute;right:0;bottom:-6px;background:var(--ink);color:var(--bg);padding:6px 14px;border-radius:99px;font-size:14px;font-weight:500}
.nums{display:grid;grid-template-columns:repeat(4,1fr);margin:48px 0}
.nums div{padding:4px 20px;border-left:1.5px solid var(--ink)}.nums b{display:block;font-size:clamp(44px,6vw,80px);font-weight:800;line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums}.nums small{color:var(--mute);font-size:14px}
.two,.split{display:grid;grid-template-columns:1.4fr 1fr;gap:48px}.split{grid-template-columns:minmax(280px,370px) 1fr}
.row{display:grid;grid-template-columns:56px 1fr auto auto;gap:16px;align-items:center;padding:14px 8px;border-top:1px solid var(--line);text-decoration:none;color:inherit;transition:background .15s}
a.row:hover,tr.cl:hover{background:var(--glass)}.row small,td small{display:block;color:var(--mute)}
.sc{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.pl{display:inline-flex;gap:6px;align-items:center;font-size:13px;font-weight:500;border:1.5px solid var(--c,var(--line));border-radius:99px;padding:2px 10px;white-space:nowrap}
.pl{--k:var(--c)}.c-ok{--c:var(--ok)}.c-constrained{--c:var(--amb)}.c-infeasible{--c:var(--sig)}.c-unknown{--c:var(--unk)}
.pl:first-letter{color:var(--c)}
.dis{margin-top:40px;color:var(--mute);font-size:14px;max-width:70ch;border-left:4px solid var(--tape);padding-left:12px}
.fld{margin-bottom:20px}.fld label{display:block;font-size:13px;color:var(--mute);margin-bottom:2px}
select,input[type=text]{height:42px;width:100%;border:0;border-bottom:1.5px solid var(--ink);background:transparent;color:var(--ink);font:inherit;border-radius:0}
select option{background:var(--bg)}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{height:34px;padding:0 14px;border:1.5px solid var(--ink);border-radius:99px;background:transparent;font-size:14px}.chip.on{background:var(--ink);color:var(--bg)}
.stage{position:fixed;inset:0;z-index:1}.stage .map{width:100%;height:100%}
.ctl,.pan{position:fixed;z-index:20;background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:18px;padding:16px;overflow:auto}
.ctl{left:clamp(12px,3vw,32px);top:92px;width:min(300px,calc(100vw - 24px));max-height:calc(100vh - 190px)}
.pan{right:clamp(12px,3vw,32px);top:92px;width:min(350px,calc(100vw - 24px));max-height:calc(100vh - 190px);animation:sl .3s}
@keyframes sl{from{transform:translateX(30px);opacity:0}}
@media(max-width:860px){.hero,.two,.split{grid-template-columns:1fr}.nums{grid-template-columns:1fr 1fr;gap:24px 0}.ctl{max-height:36vh}.pan{top:auto;bottom:84px;max-height:42vh}.row{grid-template-columns:44px 1fr auto}.row>:nth-child(4){display:none}}
.ctl h3,.pan h3{margin-bottom:8px}.ctl .fld{margin-bottom:12px}.pan p{margin:8px 0;color:var(--mute);font-size:15px}.pan .cta{margin-top:12px}
.map{display:block}.rd{stroke:var(--c);stroke-width:7;stroke-linecap:round;fill:none}.rd.dash{stroke-dasharray:3 9}
.rt{stroke:var(--tape);stroke-width:18;opacity:.85;stroke-linecap:round;fill:none}
.hit{stroke:transparent;stroke-width:26;cursor:pointer}.dim{opacity:.18}
.bd{fill:var(--c);stroke:var(--ink);stroke-width:2;cursor:pointer;transition:transform .15s;transform-box:fill-box;transform-origin:center}.bd:hover{transform:scale(1.25)}.bd.u{stroke-dasharray:3 3;fill-opacity:.45}
.sel{stroke:var(--tape);stroke-width:5;paint-order:stroke}
.st{fill:var(--ink);cursor:pointer}.is{fill:var(--sig);stroke:var(--bg);stroke-width:2;cursor:pointer}.ring{fill:none;stroke:var(--sig);stroke-width:2;animation:rg 2s infinite;transform-box:fill-box;transform-origin:center}
@keyframes rg{from{transform:scale(.6);opacity:1}to{transform:scale(2);opacity:0}}
.lg{display:flex;gap:12px;flex-wrap:wrap;font-size:13px}
table{width:100%;border-collapse:collapse}th{text-align:left;font-weight:500;color:var(--mute);font-size:13px;padding:8px}td{padding:12px 8px;border-top:1px solid var(--line);vertical-align:middle}
.tw{overflow-x:auto}tr.cl{cursor:pointer}
.drop{display:grid;place-items:center;text-align:center;min-height:240px;border:2px dashed var(--ink);border-radius:20px;padding:20px;background:var(--glass)}
.drop img{max-width:100%;max-height:300px;border-radius:12px}
.bar{height:6px;background:var(--line);border-radius:9px;margin-top:6px}.bar i{display:block;height:100%;background:var(--ink);border-radius:9px}
.ob{padding:14px 0;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:40;animation:sl .3s;font-weight:500}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:28px}@media(max-width:700px){.cmp{grid-template-columns:1fr}}
.sw{display:flex;align-items:center;gap:12px}.sw button{width:60px;height:32px;border-radius:99px;border:1.5px solid var(--ink);background:transparent;position:relative}.sw button:after{content:"";position:absolute;top:3px;left:4px;width:22px;height:22px;border-radius:50%;background:var(--ink);transition:left .25s}.sw button.on{background:var(--tape)}.sw button.on:after{left:30px}
.stp{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin:24px 0}@media(max-width:860px){.stp{grid-template-columns:1fr 1fr}}
.stp div{border-top:4px solid var(--ink);padding-top:10px}.stp b{font-size:32px}
.nf{padding:60px 0}.err{color:var(--sig);font-weight:500}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Completion pass: consistent alignment, balanced grids, and responsive dashboard */
.v{width:100%;max-width:1240px;margin-left:auto;margin-right:auto}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:24px}
.pagehead .lede{max-width:62ch}
.dashgrid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,1fr);gap:28px;align-items:start}
.dashmap{display:block;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--glass);padding:14px;text-decoration:none}
.dashmap .map{width:100%;height:auto;min-height:240px}
.dashmetrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin:28px 0 34px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:20px 0}
.dashmetrics>div{padding:8px 18px;border-left:1px solid var(--line);min-width:0}
.dashmetrics>div:first-child{border-left:0;padding-left:0}
.dashmetrics b{display:block;font-size:clamp(30px,3vw,48px);line-height:1.1;font-variant-numeric:tabular-nums}
.dashmetrics small{display:block;color:var(--mute);margin-top:6px}
.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:0 0 12px}
.sectionhead h2,.sectionhead h3{margin:0}
.quickgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}
.quicklink{display:flex;min-height:88px;flex-direction:column;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:14px;padding:14px;text-decoration:none;background:var(--glass);transition:transform .15s,border-color .15s}
.quicklink:hover{transform:translateY(-2px);border-color:var(--ink)}
.quicklink b{font-size:16px}.quicklink small{color:var(--mute)}
.activityitem{padding:12px 0;border-top:1px solid var(--line);font-size:14px}
@media(max-width:860px){.dashgrid{grid-template-columns:1fr}.dashmetrics{grid-template-columns:1fr 1fr;gap:12px 0}.dashmetrics>div:nth-child(3){border-left:0;padding-left:0}.pagehead{align-items:flex-start;flex-direction:column}}
@media(max-width:520px){.dashmetrics>div{padding:8px 10px}.quickgrid{grid-template-columns:1fr}.dashmap{padding:8px}#bg{filter:blur(8px);opacity:.09}}
</style></head><body>
<canvas id="bg" aria-hidden="true"></canvas>
<header class="top"><a class="brand" href="#/"><i></i>UNREACHABLE</a><div class="tr"><span class="demo">Demo data</span><button class="ic" id="th" aria-label="Toggle light and dark">◐</button></div></header>
<main id="app"></main>
<nav class="dk" aria-label="Main"></nav>
</body></html>
